services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scenario_modeling
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scenario_modeling"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scenario_modeling
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or a .env file}
      JWT_ISSUER: scenario-modeling
      JWT_AUDIENCE: scenario-modeling-api
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # gpl-v3 is the valid key for this non-commercial product (ADR 0005).
      HYPERFORMULA_LICENSE_KEY: ${HYPERFORMULA_LICENSE_KEY:-gpl-v3}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in the environment or a .env file}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in the environment or a .env file}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SHOWCASE_AGENT_ENABLED: ${SHOWCASE_AGENT_ENABLED:-false}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-standard}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scenario_modeling
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or a .env file}
      HYPERFORMULA_LICENSE_KEY: ${HYPERFORMULA_LICENSE_KEY:-gpl-v3}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in the environment or a .env file}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in the environment or a .env file}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:3000}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-false}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-standard}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      clamav:
        condition: service_started

  clamav:
    image: clamav/clamav:stable
    expose:
      - "3310"
    volumes:
      - clamavdata:/var/lib/clamav

  backup:
    build:
      context: ./ops/backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scenario_modeling
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-scenario-modeling/postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_KMS_KEY_ID: ${BACKUP_KMS_KEY_ID:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-ap-south-1}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BOARD_PACK_API_URL: http://backend:4000
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: {}
  clamavdata: {}
